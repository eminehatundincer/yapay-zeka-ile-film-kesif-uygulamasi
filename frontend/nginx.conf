server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Statik varlıklar için uzun süreli tarayıcı önbelleği
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA yönlendirmesi (tüm alt yolları index.html'e yönlendir)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
